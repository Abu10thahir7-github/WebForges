<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Title -->
    <title>Web Forges | Professional Web Development & SEO Services</title>

    <!-- Description -->
    <meta
      name="description"
      content="Web Forges offers affordable, SEO-friendly, high-performance websites using React, Node.js, and modern UI/UX. Perfect for startups, freelancers, and businesses in India."
    /> <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="logo.png"
    />

    <!-- Keywords (Max SEO Effect) -->
    <meta
      name="keywords"
      content="web development, React developer, Node developer, MERN stack, SEO web design, freelance developer India, responsive website, affordable web agency, ecommerce website design, portfolio sites, UI/UX design, fast websites, hosting included, best budget web developer"
    />

    <!-- Author -->
    <meta name="author" content="Webforges Team, Palakkad, Kerala" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Web Forges | Freelance Web Development Agency" />
    <meta
      property="og:description"
      content="Affordable & premium web development. We build modern, fast, SEO-optimized websites for small businesses, startups, and individuals."
    />
    <meta property="og:url" content="https://dev.webforges.site/" />
    <meta property="og:image" content="https://dev.webforges.site/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Webforges" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Webforges - Affordable Website Design for Startups & Freelancers" />
    <meta
      name="twitter:description"
      content="Get a fully responsive, SEO-ready, fast website at budget price. MERN stack + UI/UX + Branding in one place!"
    />
    <meta name="twitter:image" content="https://dev.webforges.site/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://dev.webforges.site/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chilanka&family=Macondo&family=Manjari:wght@100;400;700&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- GSAP Scroll Animations (Optional Performance Boost Tip: Load defer) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Webforges",
        "url": "https://dev.webforges.site",
        "author": {
          "@type": "Person",
          "name": "Muhammed Sulaiman T"
        },
        "description": "Webforges is a freelance web agency building modern, fast, responsive websites using the MERN stack with SEO optimization.",
        "image": "https://dev.webforges.site/logo.png",
        "inLanguage": "en-IN",
        "publisher": {
          "@type": "Organization",
          "name": "Webforges"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
